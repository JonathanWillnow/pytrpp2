name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  UV_VERSION: 0.5.31

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # Use the interpreter from setup-python instead of letting uv download one: setup-uv runs
      # that download silently, so a failed download only showed "uv failed with exit code 1".
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - name: Run tests
        run: uv run pytest
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check --diff
      - name: Mypy type check
        run: uv run mypy .
